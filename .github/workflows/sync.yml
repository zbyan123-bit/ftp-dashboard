name: Sync Strava and WHOOP
on:
  schedule:
    - cron: '7,37 * * * *'   # every 30 minutes
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: dashboard-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet cryptography==43.0.3 numpy==2.1.3
      - name: Pull new rides and WHOOP mornings
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
        run: python scripts/sync.py
      - name: Rebuild and publish if anything changed
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data state)" ]; then echo "Nothing new"; exit 0; fi
          python build.py
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data state index.html out
          if git diff --cached --quiet -- data; then MSG="Refresh tokens"; else MSG="Auto update $(TZ=Asia/Kuala_Lumpur date +%Y-%m-%d\ %H:%M)"; fi
          git commit -q -m "$MSG"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
